name: Firewall checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Install build dependencies
        run: |
          # Avoid the runner image's Azure mirror DNS failure. Keep Ubuntu's
          # signed repositories and fail if an index cannot be refreshed.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y clang llvm libbpf-dev linux-libc-dev gcc make iproute2 python3
      - run: ./build.sh
      - run: make test
      - run: sudo tests/integration/bootstrap.sh
      - run: sudo tests/integration/demo.sh
      - run: sudo bash tests/integration/firewall.sh
      - run: sudo bash tests/integration/lifecycle.sh
      - run: sudo env "PATH=$PATH" bash bpf/test.sh --kernel
