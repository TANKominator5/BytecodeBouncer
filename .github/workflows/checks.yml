name: Bootstrap checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev gcc make iproute2 python3
      - run: ./build.sh
      - run: make test
      - run: sudo tests/integration/bootstrap.sh
      - run: sudo tests/integration/demo.sh
