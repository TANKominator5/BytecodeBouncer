<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trafficcop</title>
<style>body{background:#171c24;color:#eee;font:18px system-ui;max-width:960px;margin:4rem auto;padding:1rem}h1{color:#ffaf45}pre{background:#242d39;padding:1.5rem;overflow:auto}.notice{border-left:4px solid #ffaf45;padding:1rem}#status{color:#b9d9bf}</style>
<h1>Bytecode Bouncer</h1><p class="notice">Bootstrap dashboard · filtering and reload are available. Jail listing and event logging are pending.</p><p id="status" role="status">Connecting…</p><pre id="stats" aria-label="Live packet counters"></pre>
<script>let previous;async function update(){try{const r=await fetch('/stats.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json(),now=performance.now();let rate='';if(previous){const seconds=(now-previous.time)/1000;rate=` · ${((s.passed-previous.passed)/seconds).toFixed(0)} passed/s · ${((s.dropped-previous.dropped)/seconds).toFixed(0)} dropped/s`;}document.getElementById('stats').textContent=JSON.stringify(s,null,2);document.getElementById('status').textContent='Live'+rate;previous={time:now,passed:s.passed,dropped:s.dropped};}catch(e){document.getElementById('status').textContent='Connection unavailable: '+e.message;}setTimeout(update,1000);}update();</script></html>
